name: check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # TODO: 言語ランタイムのセットアップを足す（例: astral-sh/setup-uv, actions/setup-node）
      - run: ./scripts/check.sh
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-log
          path: .agent/check.log
